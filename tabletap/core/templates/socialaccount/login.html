{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In via Google | TableTap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, sans-serif;
    }
    .card {
      max-width: 500px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    .btn-primary {
      width: 100%;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2 class="text-center mb-3">Sign In via Google</h2>
    <p class="text-muted text-center">You're about to sign in using your Google account.</p>
    <form method="post" action="{{ form.action }}">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary mt-3"><i class="bi bi-box-arrow-in-right"></i> Continue</button>
    </form>
    <div class="mt-3 text-center">
      <a href="{% url 'login' %}" class="text-decoration-none">Back to Login</a>
    </div>
  </div>
</body>
</html>

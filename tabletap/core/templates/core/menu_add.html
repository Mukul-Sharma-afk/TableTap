{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add New Menu - TableTap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- Navbar -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top" role="navigation" aria-label="Main Navigation">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'dashboard' %}" aria-label="Go To Dashboard">
          <i class="bi-cup-hot" aria-hidden="true"></i> TableTap{% if business_name %} - {{ business_name }}{% endif %}
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-label="Toggle Button">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                <i class="bi bi-person-circle" aria-hidden="true"></i> {{ user.first_name }} {{ user.last_name }}
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <hr class="dropdown-divider" />
                </li>
                <li><a class="dropdown-item" href="{% url 'logout' %}" aria-label="Logout">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Logout</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <div class="container py-5">
    <h1 class="mb-4"><i class="bi bi-plus-circle" aria-hidden="true"></i> Add New Menu</h1>
    <form method="post" aria-label="Form To Add New Menu">
      {% csrf_token %}

      <div class="mb-3">
        <label for="menu-name" class="form-label">Menu Name</label>
        <input type="text" class="form-control" name="name" id="menu-name" placeholder="e.g., Breakfast, Dinner"
          required aria-required="true">
      </div>

      <div class="mb-3">
        <label for="menu-description" class="form-label">Description (optional)</label>
        <textarea name="description" class="form-control" id="menu-description" rows="3"></textarea>
      </div>

      <div class="d-flex justify-content-between">
        <a href="{% url 'menu_management' %}" class="btn btn-secondary" aria-label="Cancel Button">Cancel</a>
        <button type="submit" class="btn btn-primary" aria-label="Submit Button">Create Menu</button>
      </div>
    </form>
  </div>
</body>

</html>

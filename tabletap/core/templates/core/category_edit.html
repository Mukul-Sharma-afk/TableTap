{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Category - TableTap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-5" role="main" aria-labelledby="edit-category-heading">
        <h2 id="edit-category-heading" class="mb-4">Edit Category</h2>

        <form method="POST" aria-label="Edit a Menu Category Form">
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.name.id_for_label }}" id="category-name-label" class="form-label">Category Name</label>
                {{ form.name }}
            </div>

            <button type="submit" class="btn btn-primary" aria-label="Save Category Changes">Save Changes</button>
            <a href="{% url 'menu_management' %}" class="btn btn-secondary" aria-label="Cancel Button">Cancel</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
